# Publishes the RosCAM web app (web/ + the Python engine) to GitHub Pages.
# The app runs entirely in the visitor's browser, so this is static hosting only.
#
# One-time setup: repo Settings -> Pages -> Build and deployment -> Source: GitHub Actions.
name: Publish RosCAM web app

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test before publishing
        run: |
          pip install -r requirements.txt
          PENGUINCAM_STRICT_GCODE=1 python -m unittest discover -s tests -t .

      - name: Set up Rust for the G-code converter (compiled to WebAssembly)
        run: rustup target add wasm32-unknown-unknown

      - name: Test the converter
        run: cargo test --quiet --manifest-path converter/Cargo.toml

      - name: Build site
        run: python web/build.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
